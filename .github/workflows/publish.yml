name: Publish to npm

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (none, patch, minor, major)'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - patch
          - minor
          - major

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-and-publish:
    name: Build & Publish Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade npm for Trusted Publishing (OIDC)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build TypeScript
        run: npm run build

      - name: Bump version (Manual Dispatch)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.bump != 'none' && github.event.inputs.bump != ''
        run: |
          npm version ${{ github.event.inputs.bump }} --no-git-tag-version
          NEW_VER=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): bump version to $NEW_VER [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Check version against npm registry & GitHub
        id: check-version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          echo "Package: $PACKAGE_NAME"
          echo "Local version: $LOCAL_VERSION"
          echo "local_version=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"

          # Check npm registry
          if npm view "$PACKAGE_NAME@$LOCAL_VERSION" version --silent > /dev/null 2>&1; then
            echo "Version $LOCAL_VERSION already exists on npm."
            echo "should_publish_npm=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version $LOCAL_VERSION detected for npm."
            echo "should_publish_npm=true" >> "$GITHUB_OUTPUT"
          fi

          # Check GitHub release
          if gh release view "v$LOCAL_VERSION" > /dev/null 2>&1; then
            echo "Release v$LOCAL_VERSION already exists on GitHub."
            echo "should_release_gh=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release v$LOCAL_VERSION needed on GitHub."
            echo "should_release_gh=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package tarball
        id: pack
        run: |
          TARBALL=$(npm pack)
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Publish to npm (Trusted Publishing / OIDC & Token)
        if: steps.check-version.outputs.should_publish_npm == 'true'
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          fi
          npm publish --access public --provenance || npm publish --access public
          rm -f ~/.npmrc

      - name: Publish to GitHub Packages
        if: steps.check-version.outputs.should_release_gh == 'true' || steps.check-version.outputs.should_publish_npm == 'true'
        run: |
          npm pkg set name="@unified-devtools/react-native-core"
          echo "@unified-devtools:registry=https://npm.pkg.github.com" > ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc
          npm publish || true
          rm -f ~/.npmrc
          git checkout package.json

      - name: Create Git Tag & GitHub Release
        if: steps.check-version.outputs.should_release_gh == 'true'
        run: |
          VERSION="v${{ steps.check-version.outputs.local_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION" || true
          git push origin "$VERSION" || true

          TARBALL="${{ steps.pack.outputs.tarball }}"
          if [ -f "$TARBALL" ]; then
            gh release create "$VERSION" "$TARBALL" \
              --title "Release $VERSION" \
              --generate-notes
          else
            gh release create "$VERSION" \
              --title "Release $VERSION" \
              --generate-notes
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
